# Checks every push and pull request. Deploys are done by Vercel's Git integration, whose
# build runs the same lint + tests first (vercel.json), so a red build never reaches production.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22 # same major as package.json "engines"
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
