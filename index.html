<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevDrop — Utilitários online para desenvolvedores e para o dia a dia</title>
    <meta
      name="description"
      content="21 ferramentas grátis no navegador: formatadores de JSON, XML e SQL, Base64, URL e JWT, geradores de senha, UUID, hash, CPF e CNPJ, calculadoras e utilitários de texto e CSS. Sem cadastro e sem enviar seus dados."
    />
    <meta name="theme-color" content="#f9fafb" />
    <!-- Link previews. %SITE_URL% is filled at build time (vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DevDrop" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="DevDrop — Utilitários online para desenvolvedores e para o dia a dia" />
    <meta property="og:locale" content="pt_BR" />
    <meta
      property="og:description"
      content="Formate JSON, gere senhas, UUIDs e CPFs, calcule porcentagens e muito mais, direto no navegador. Grátis, sem cadastro e sem enviar seus dados."
    />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DevDrop: ferramentas rápidas para tarefas do dia a dia" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Theme before first paint, so a dark-mode visit never flashes white. Same key and
         class as src/lib/theme.ts. -->
    <script>
      (function () {
        var theme
        try {
          theme = localStorage.getItem('devdrop-theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        if (theme === 'dark') {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b1120')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
